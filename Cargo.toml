[package]
name = "pullbell"
version = "0.6.0"
edition = "2024"
description = "A macOS menu bar app for GitHub pull request notifications with OAuth device flow."
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native"] }
mac-notification-sys = "0.6"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tray-icon = "0.21"
url = "2"
urlencoding = "2"
wry = "0.55.1"

[dev-dependencies]
pretty_assertions = "1"
