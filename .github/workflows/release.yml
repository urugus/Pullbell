name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check tag matches Cargo version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Tag version v$tag_version does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package and ad-hoc sign app bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="pullbell-${version}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          scripts/package-macos-app.sh "target/${{ matrix.target }}/release/pullbell" "dist/$package" "$version"
          scripts/sign-macos-app.sh "dist/$package/Pullbell.app" -
          ditto --norsrc -c -k --keepParent "dist/$package/Pullbell.app" "dist/$package.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pullbell-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --generate-notes --repo "${GITHUB_REPOSITORY}"

  homebrew:
    name: Update Homebrew Cask
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'urugus/homebrew-tap' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Read release checksums
        id: checksums
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm64_package="pullbell-${version}-aarch64-apple-darwin.zip"
          x86_64_package="pullbell-${version}-x86_64-apple-darwin.zip"

          arm64_sha256="$(sha256sum "$arm64_package" | cut -d ' ' -f 1)"
          x86_64_sha256="$(sha256sum "$x86_64_package" | cut -d ' ' -f 1)"

          {
            echo "version=$version"
            echo "arm64_sha256=$arm64_sha256"
            echo "x86_64_sha256=$x86_64_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        run: |
          source/scripts/generate-homebrew-cask.sh \
            "${{ steps.checksums.outputs.version }}" \
            "${{ steps.checksums.outputs.arm64_sha256 }}" \
            "${{ steps.checksums.outputs.x86_64_sha256 }}" \
            homebrew-tap/Casks/pullbell.rb

      - name: Commit cask update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- Casks/pullbell.rb)" ]; then
            echo "Homebrew Cask is already up to date."
            exit 0
          fi

          git add Casks/pullbell.rb
          git commit -m "Update Pullbell to ${{ steps.checksums.outputs.version }}"
          git push
